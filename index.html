
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nepali Romanian Translator</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#eef2ff;font-family:Arial,sans-serif;color:#172554}
.app{max-width:500px;margin:20px auto;background:white;padding:22px;border-radius:20px;box-shadow:0 5px 25px #0001}
h2{text-align:center;color:#4338ca}
select,textarea,button{width:100%;padding:14px;margin:9px 0;border-radius:10px;font-size:16px}
select,textarea{border:1px solid #cbd5e1}
textarea{height:130px;resize:vertical}
button{border:0;background:#4f46e5;color:white;font-weight:bold}
button:active{opacity:.8}
.result{background:#f1f5f9;padding:15px;border-radius:10px;min-height:90px;white-space:pre-wrap}
.small{background:#0f766e}
</style>
</head>
<body>
<div class="app">
<h2>🇳🇵 Nepali ↔ Romanian 🇷🇴</h2>
<p>Translate your language easily</p>
<select id="direction">
<option value="ne-ro">Nepali → Romanian</option>
<option value="ro-ne">Romanian → Nepali</option>
</select>
<textarea id="source" placeholder="यहाँ आफ्नो शब्द वा वाक्य लेख्नुहोस्..."></textarea>
<button onclick="translateText()">Translate / अनुवाद</button>
<h3>Translation / अनुवाद</h3>
<div class="result" id="result">Your translation appears here...</div>
<button class="small" onclick="speak()">🔊 Speak / बोल्नुहोस्</button>
<button class="small" onclick="copyResult()">📋 Copy Translation</button>
<p id="status"></p>
</div>
<script>
async function translateText(){
 const input=document.getElementById("source").value.trim();
 const direction=document.getElementById("direction").value;
 const result=document.getElementById("result");
 const status=document.getElementById("status");
 if(!input){status.textContent="कृपया शब्द वा वाक्य लेख्नुहोस्।";return;}
 result.textContent="अनुवाद हुँदैछ...";
 status.textContent="";
 const lang=direction==="ne-ro"?"ne|ro":"ro|ne";
 try{
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(input)+"&langpair="+lang;
  const response=await fetch(url);
  if(!response.ok)throw new Error("Network error");
  const data=await response.json();
  if(data.responseStatus!==200)throw new Error(data.responseDetails||"Translation unavailable");
  result.textContent=data.responseData.translatedText;
  status.textContent="अनुवाद सफल भयो।";
 }catch(e){
  result.textContent="अनुवाद हुन सकेन। इन्टरनेट वा सेवा जाँच गर्नुहोस्।";
  status.textContent=e.message;
 }
}
function speak(){
 const text=document.getElementById("result").textContent;
 const direction=document.getElementById("direction").value;
 if(!text||text.includes("appears here"))return;
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=direction==="ne-ro"?"ro-RO":"ne-NP";
 speechSynthesis.speak(utterance);
}
function copyResult(){
 const text=document.getElementById("result").textContent;
 navigator.clipboard.writeText(text).then(()=>alert("Copied!"));
}
</script>
</body>
</html>
