
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Nepali Romanian Translator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2ff;font-family:Arial,sans-serif;color:#172554;padding:15px}
.app{max-width:480px;margin:15px auto;background:white;padding:20px;border-radius:20px;box-shadow:0 4px 18px #0002}
h2{text-align:center;color:#4338ca}
select,button{width:100%;padding:15px;margin:9px 0;border-radius:12px;font-size:16px}
select{border:1px solid #ccc;background:white}
button{border:0;background:#4f46e5;color:white;font-weight:bold}
.start{background:#059669;font-size:19px}
.stop{background:#dc2626}
.panel{background:#f1f5f9;padding:14px;margin:12px 0;border-radius:12px;min-height:75px;white-space:pre-wrap}
.status{text-align:center;color:#087e65;font-weight:bold;min-height:25px}
.small{font-size:13px;color:#64748b;text-align:center}
</style>
</head>
<body>
<div class="app">
<h2>🇳🇵 ↔ 🇷🇴</h2>
<h3 style="text-align:center">Live Voice Translator</h3>
<p style="text-align:center">बोल्नुहोस्, अनुवाद आफैँ हुन्छ।</p>

<label>तपाईंले बोल्ने भाषा:</label>
<select id="localLang">
<option value="ne">नेपाली (Nepali)</option>
<option value="hi">हिन्दी (Hindi)</option>
</select>

<div class="panel">
<b>तपाईंले बोलेको:</b>
<div id="heard">यहाँ आवाजबाट आएको शब्द देखिन्छ।</div>
</div>

<div class="panel">
<b>अनुवाद:</b>
<div id="translated">Translation appears here.</div>
</div>

<div class="status" id="status">सुरु गर्न बटन थिच्नुहोस्।</div>

<button class="start" id="startBtn" onclick="startConversation()">
🎤 सुरु गर्नुहोस् / Start Conversation
</button>

<button class="stop" onclick="stopConversation()">
⏹ रोक्नुहोस् / Stop
</button>

<p class="small">
पहिले नेपाली वा हिन्दी बोल्नुहोस्। त्यसपछि रोमानियन बोल्नुहोस्।
एपले पालैपालो भाषा परिवर्तन गर्नेछ।
</p>
</div>

<script>
let active=false;
let busy=false;
let currentSpeaker="local";
let timer=null;

function scheduleListen(){
 clearTimeout(timer);
 timer=setTimeout(listenTurn,900);
}

function startConversation(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  alert("यो Browser मा Voice Recognition उपलब्ध छैन। Android Chrome प्रयोग गर्नुहोस्।");
  return;
 }
 if(!window.isSecureContext){
  alert("सुरक्षित HTTPS वेबसाइटबाट खोल्नुहोस्।");
  return;
 }
 speechSynthesis.cancel();
 active=true;
 busy=false;
 currentSpeaker="local";
 document.getElementById("heard").textContent="";
 document.getElementById("translated").textContent="";
 document.getElementById("status").textContent="माइक्रोफोन अनुमति दिनुहोस्...";
 listenTurn();
}

function stopConversation(){
 active=false;
 busy=false;
 clearTimeout(timer);
 speechSynthesis.cancel();
 document.getElementById("status").textContent="अनुवाद रोकियो।";
}

function listenTurn(){
 if(!active||busy)return;

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return;

 const local=document.getElementById("localLang").value;
 const language=currentSpeaker==="local"
   ? (local==="ne"?"ne-NP":"hi-IN")
   : "ro-RO";

 document.getElementById("status").textContent=
 currentSpeaker==="local"
 ? "🎤 नेपाली / हिन्दी बोल्नुहोस्..."
 : "🎤 Romanian vorbiți...";

 const rec=new SR();
 rec.lang=language;
 rec.continuous=false;
 rec.interimResults=false;
 rec.maxAlternatives=1;

 rec.onresult=async function(event){
  const sentence=event.results[0][0].transcript.trim();
  if(!sentence||busy)return;

  busy=true;
  rec.stop();
  document.getElementById("heard").textContent=sentence;
  document.getElementById("status").textContent="अनुवाद हुँदैछ...";

  const from=currentSpeaker==="local"?local:"ro";
  const to=currentSpeaker==="local"?"ro":local;

  try{
   const bytes=new TextEncoder().encode(sentence).length;
   if(bytes>450)throw Error("वाक्य धेरै लामो भयो।");

   const params=new URLSearchParams({
    q:sentence,
    langpair:from+"|"+to
   });

   const response=await fetch(
    "https://api.mymemory.translated.net/get?"+params
   );

   if(!response.ok)throw Error("Translation service unavailable");

   const data=await response.json();

   if(data.responseStatus!==200)
    throw Error(data.responseDetails||"अनुवाद उपलब्ध भएन");

   const answer=data.responseData.translatedText;

   if(!answer)throw Error("अनुवाद भेटिएन।");

   document.getElementById("translated").textContent=answer;

   currentSpeaker=currentSpeaker==="local"?"ro":"local";

   speakAnswer(answer,to);

  }catch(error){
   document.getElementById("status").textContent=
   "समस्या: "+error.message;
   busy=false;
   if(active)scheduleListen();
  }
 };

 rec.onerror=function(event){
  if(!active)return;
  document.getElementById("status").textContent=
   event.error==="not-allowed"
   ?"माइक्रोफोन अनुमति दिनुहोस्।"
   :"आवाज बुझ्न सकिएन। फेरि बोल्नुहोस्।";

  if(event.error==="not-allowed"||event.error==="service-not-allowed"){
   active=false;
   return;
  }
  if(!busy)scheduleListen();
 };

 rec.onend=function(){
  if(active&&!busy)scheduleListen();
 };

 try{
  rec.start();
 }catch(error){
  document.getElementById("status").textContent=
   "माइक्रोफोन सुरु भएन। फेरि प्रयास गर्नुहोस्।";
 }
}

function speakAnswer(text,language){
 speechSynthesis.cancel();

 const voice=new SpeechSynthesisUtterance(text);
 voice.lang=language==="ro"?"ro-RO":
 language==="hi"?"hi-IN":"ne-NP";
 voice.rate=0.9;

 voice.onend=function(){
  busy=false;
  if(active)scheduleListen();
 };

 voice.onerror=function(){
  busy=false;
  if(active)scheduleListen();
 };

 speechSynthesis.speak(voice);
}
</script>
</body>
</html>
