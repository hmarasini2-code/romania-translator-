
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Voice Translator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef3ff;
  text-align: center;
  padding: 15px;
}
.container {
  max-width: 480px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 3px 15px #0002;
}
h2 { color: #174ea6; }
select, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 10px;
  font-size: 17px;
}
select { border: 1px solid #aaa; }
button {
  border: none;
  background: #1769e0;
  color: white;
  cursor: pointer;
}
button:disabled { opacity: .5; }
.result {
  background: #f0f4fa;
  padding: 15px;
  border-radius: 10px;
  min-height: 55px;
  margin-top: 10px;
  overflow-wrap: anywhere;
}
.small { font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="container">
<h2>🎤 My Voice Translator</h2>
<p>Romanian ↔ Nepali / Hindi</p>

<label>अनुवादको भाषा छान्नुहोस्</label>
<select id="language">
  <option value="ne">नेपाली</option>
  <option value="hi">हिन्दी</option>
</select>

<hr>

<h3>🇷🇴 Romanian → नेपाली / हिन्दी</h3>
<button onclick="startListening('ro-RO','ro')">
🎙️ रोमानियन बोल्नुहोस्
</button>
<div class="result" id="result1">अनुवाद यहाँ देखिन्छ</div>
<button onclick="speak('result1','target')">🔊 आवाज सुन्नुहोस्</button>

<hr>

<h3>नेपाली / हिन्दी → 🇷🇴 Romanian</h3>
<button onclick="startListening('source','target')">
🎙️ नेपाली / हिन्दी बोल्नुहोस्
</button>
<div class="result" id="result2">अनुवाद यहाँ देखिन्छ</div>
<button onclick="speak('result2','ro-RO')">🔊 Romanian आवाज सुन्नुहोस्</button>

<p id="status" class="small">माइक्रोफोन थिचेर बोल्न सुरु गर्नुहोस्।</p>
</div>

<script>
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let currentTranslation = "";

async function translateText(text, from, to, outputId) {
  const output = document.getElementById(outputId);
  output.innerText = "अनुवाद हुँदैछ...";

  try {
    const url = "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=" + from + "|" + to;

    const response = await fetch(url);
    const data = await response.json();

    if (data.responseStatus !== 200) {
      throw new Error("Translation unavailable");
    }

    currentTranslation = data.responseData.translatedText;
    output.innerText = currentTranslation;
    document.getElementById("status").innerText =
      "अनुवाद पूरा भयो। आवाज सुन्न बटन थिच्नुहोस्।";
  } catch (error) {
    output.innerText = "अनुवाद हुन सकेन। इन्टरनेट जाँच गर्नुहोस्।";
    document.getElementById("status").innerText =
      "कृपया फेरि प्रयास गर्नुहोस्।";
  }
}

function startListening(language, direction) {
  if (!SpeechRecognition) {
    alert("कृपया Android Chrome मा यो एप खोल्नुहोस्।");
    return;
  }

  const selected = document.getElementById("language").value;
  const sourceLang = language === "source"
    ? (selected === "ne" ? "ne-NP" : "hi-IN")
    : "ro-RO";

  const from = direction === "ro" ? "ro" : selected;
  const to = direction === "ro" ? selected : "ro";
  const outputId = direction === "ro" ? "result1" : "result2";

  const recognition = new SpeechRecognition();
  recognition.lang = sourceLang;
  recognition.continuous = false;
  recognition.interimResults = false;

  document.getElementById("status").innerText = "🎙️ सुन्दैछु... अब बोल्नुहोस्।";

  recognition.onresult = function(event) {
    const spoken = event.results[0][0].transcript;
    document.getElementById("status").innerText =
      "तपाईंले भन्नुभयो: " + spoken;
    translateText(spoken, from, to, outputId);
  };

  recognition.onerror = function(event) {
    document.getElementById("status").innerText =
      "आवाज सुन्न समस्या भयो: " + event.error;
  };

  recognition.onend = function() {
    // एक पटकको आवाज सुनेपछि रोकिन्छ।
  };

  recognition.start();
}

function speak(outputId, language) {
  const text = document.getElementById(outputId).innerText;

  if (!text || text.includes("अनुवाद")) {
    alert("पहिले अनुवाद गर्नुहोस्।");
    return;
  }

  if (!window.speechSynthesis) {
    alert("यो ब्राउजरमा आवाज सुविधा उपलब्ध छैन।");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();

  let lang = language;
  if (language === "target") {
    lang = document.getElementById("language").value === "ne"
      ? "ne-NP" : "hi-IN";
  }

  utterance.lang = lang;

  const matching = voices.filter(v =>
    v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())
  );

  const female = matching.find(v =>
    /female|woman|zira|samantha|sara|google.*female/i.test(v.name)
  );

  if (female) utterance.voice = female;
  else if (matching.length) utterance.voice = matching[0];

  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}

speechSynthesis.onvoiceschanged = function() {
  speechSynthesis.getVoices();
};
</script>
</body>
</html>
